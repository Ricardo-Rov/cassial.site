baseURL: "https://cassial.site/"
title: "Cassial"
theme: "PaperMod"
locale: "zh-cn"
defaultContentLanguage: "zh-cn"
hasCJKLanguage: true
paginate: 10
enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

minify:
  disableXML: true
  minifyOutput: true

params:
  env: production
  title: "Cassial"
  description: "Cassial 的个人主页与博客"
  author: "Cassial"
  mainSections: ["posts"]
  DateFormat: "2006年1月2日"
  defaultTheme: auto
  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: true
  ShowToc: true
  TocOpen: false
  disableSpecial1stPost: false
  disableScrollToTop: false
  comments: false
  hidemeta: false
  hideSummary: false
  showtoc: true
  tocopen: false

  homeInfoParams:
    Title: "Hi, 我是 Cassial"
    Content: >
      欢迎来到我的个人网站。这里记录我的博客文章与项目。
      （这段介绍文字稍后可替换为你的真实简介。）

  socialIcons:
    - name: github
      url: "https://github.com/"
    - name: email
      url: "mailto:hi@cassial.site"

  cover:
    hidden: true

  editPost:
    Disabled: true

outputs:
  home:
    - HTML
    - RSS
    - JSON

menu:
  main:
    - identifier: home
      name: 首页
      url: /
      weight: 10
    - identifier: posts
      name: 文章
      url: /posts/
      weight: 20
    - identifier: archives
      name: 归档
      url: /archives/
      weight: 30
    - identifier: search
      name: 搜索
      url: /search/
      weight: 40
    - identifier: about
      name: 关于
      url: /about/
      weight: 50

taxonomies:
  tag: tags
  category: categories
